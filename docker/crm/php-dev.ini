; Valores SOLO para desarrollo, no auditados de PHP web en produccion.
date.timezone=America/Lima
memory_limit=512M
upload_max_filesize=100M
post_max_size=110M
max_execution_time=120
max_input_vars=3000
display_errors=On
log_errors=On
expose_php=Off
; Desarrollo rápido: Apache usa OPcache, pero comprueba cambios de código en
; cada petición. CLI queda desactivado para no falsear los benchmarks.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.file_update_protection=0
opcache.save_comments=1
opcache.jit=0

; Suficiente para el árbol de Laravel y sin ocultar cambios de rutas/config.
realpath_cache_size=4096K
realpath_cache_ttl=120
